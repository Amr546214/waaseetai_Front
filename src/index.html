<!doctype html>
<html lang="en" dir="rtl">

<head>
	<meta charset="utf-8">
	<!-- THEME INIT: MUST be the first script — runs before any CSS/paint to prevent FOUC.
	     Mirrors the design-reference approach (localStorage 'waseet_theme'). -->
	<script>
		(function () {
			try {
				var t = localStorage.getItem('waseet_theme');
				if (!t) {
					t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
				}
				var h = document.documentElement;
				if (t === 'light') {
					h.classList.add('light-theme', 'theme-light');
					h.style.background = '#F6F8FC';
					h.setAttribute('data-theme', 'light');
				} else {
					h.classList.add('dark');
					h.style.background = '#070D24';
					h.setAttribute('data-theme', 'dark');
				}
			} catch (e) { document.documentElement.style.background = '#070D24'; }
		})();
	</script>
	<style>
		/* Base html/body colors — set here so the first paint uses the correct theme
		   even before the app stylesheet loads (prevents SSR dark → client light flash). */
		html { background: #070D24; }
		html.light-theme, html.theme-light { background: #F6F8FC; }
		body { margin: 0; background: inherit; }
	</style>
	<base href="/">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>وسيط AI | للخدمات الذكية</title>
	<link rel="icon" type="image/png" href="assets/brand/waseet-mark.png">
	<meta name="description"
		content="وسيط AI للخدمات المهنية الموثقة - اربط طلبات الخدمة والعقود والمدفوعات في تجربة واحدة مدعومة بذكاء اصطناعي">
	<!-- Link preview (WhatsApp / social): a dedicated 1200x630 share image, NOT the site logo. Absolute URLs, in the static HTML (crawlers do not run JS).
	     Bump the file name (waseetai-og-v3.jpg) to defeat a stale WhatsApp cache. -->
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="وسيط AI">
	<meta property="og:locale" content="ar_SA">
	<meta property="og:title" content="وسيط AI | الوساطة المهنية الذكية">
	<meta property="og:description" content="يربط طالبي الخدمات بمقدميها عبر الذكاء الاصطناعي، من اختيار الأنسب والتعاقد إلى متابعة التنفيذ والتسليم، مع ضمان مالي يحفظ حقوق الطرفين.">
	<meta property="og:url" content="https://dev.waseetai.com/">
	<meta property="og:image" content="https://dev.waseetai.com/assets/social/waseetai-og-v3.jpg">
	<meta property="og:image:url" content="https://dev.waseetai.com/assets/social/waseetai-og-v3.jpg">
	<meta property="og:image:secure_url" content="https://dev.waseetai.com/assets/social/waseetai-og-v3.jpg">
	<meta property="og:image:type" content="image/jpeg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="شعار وسيط AI">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="وسيط AI | الوساطة المهنية الذكية">
	<meta name="twitter:description" content="يربط طالبي الخدمات بمقدميها عبر الذكاء الاصطناعي، من اختيار الأنسب والتعاقد إلى متابعة التنفيذ والتسليم، مع ضمان مالي يحفظ حقوق الطرفين.">
	<meta name="twitter:image" content="https://dev.waseetai.com/assets/social/waseetai-og-v3.jpg">
	<meta name="twitter:image:alt" content="شعار وسيط AI">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
	<script src="assets/ws-light-polish.js" defer></script>

	<style>
		/* Waseet AI Professional Loader */
		.app-loader-container {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background-color: #070D24;
			/* Fallback to Navy */
			background-color: var(--pg, #070D24);
			z-index: 999999;
			overflow: hidden;
			transition: background-color 0.3s ease;
		}

		/* Light theme support before Angular loads */
		body.light-theme .app-loader-container {
			background-color: #F6F8FC;
		}

		body.light-theme .loader-text {
			color: #070D24;
		}

		.loader-bg-glow {
			position: absolute;
			width: 70vw;
			height: 70vw;
			max-width: 800px;
			max-height: 800px;
			background: radial-gradient(circle, rgba(43, 212, 199, 0.08) 0%, rgba(43, 127, 255, 0.04) 40%, transparent 70%);
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			animation: pulse-glow 4s ease-in-out infinite alternate;
			pointer-events: none;
		}

		.loader-logo-wrapper {
			position: relative;
			width: 85px;
			height: 85px;
			margin-bottom: 35px;
			z-index: 2;
			animation: float-logo 3s ease-in-out infinite;
		}

		.loader-logo {
			width: 100%;
			height: 100%;
			object-fit: contain;
			filter: drop-shadow(0 12px 24px rgba(43, 212, 199, 0.35));
		}

		.loader-bar-container {
			width: 220px;
			height: 4px;
			background: rgba(168, 178, 209, 0.15);
			border-radius: 8px;
			position: relative;
			overflow: hidden;
			z-index: 2;
		}

		.loader-bar {
			position: absolute;
			top: 0;
			left: -100%;
			width: 50%;
			height: 100%;
			background: linear-gradient(90deg, transparent, #2BD4C7, #2B7FFF, transparent);
			border-radius: 8px;
			animation: slide-bar 1.8s infinite ease-in-out;
		}

		.loader-text {
			margin-top: 24px;
			font-family: 'Tajawal', sans-serif;
			font-size: 15px;
			font-weight: 700;
			color: #FFFFFF;
			letter-spacing: 0.5px;
			z-index: 2;
			animation: fade-text 2s infinite alternate;
		}

		@keyframes pulse-glow {
			0% {
				transform: translate(-50%, -50%) scale(0.85);
				opacity: 0.6;
			}

			100% {
				transform: translate(-50%, -50%) scale(1.15);
				opacity: 1;
			}
		}

		@keyframes float-logo {
			0% {
				transform: translateY(0px);
			}

			50% {
				transform: translateY(-12px);
			}

			100% {
				transform: translateY(0px);
			}
		}

		@keyframes slide-bar {
			0% {
				left: -100%;
			}

			100% {
				left: 200%;
			}
		}

		@keyframes fade-text {
			0% {
				opacity: 0.5;
			}

			100% {
				opacity: 1;
			}
		}
	</style>
</head>

<body>
	<!-- Body theme sync: mirror the html theme class onto body for legacy selectors
	     (main theme init already ran at top of <head>). -->
	<script>
		(function () {
			try {
				var h = document.documentElement;
				if (h.classList.contains('light-theme') || h.classList.contains('theme-light')) {
					document.body.classList.add('light-theme', 'theme-light');
				}
			} catch (e) { }
		})();
	</script>

	<app-root>
		<!-- Initial Loading Screen (Destroyed when Angular bootstraps) -->
		<div class="app-loader-container">
			<div class="loader-bg-glow"></div>

			<div class="loader-logo-wrapper">
				<img src="assets/brand/waseet-mark.png" alt="Waseet AI" class="loader-logo">
			</div>

			<div class="loader-bar-container">
				<div class="loader-bar"></div>
			</div>

			<div class="loader-text">جاري تهيئة مساحة العمل...</div>
		</div>
	</app-root>
	<!-- Site identity (server-managed). Two loaders exist and they ALWAYS show the same file, because both read the same key `logo.boot`:
	       (1) the static <img class="loader-logo"> above (index.html, painted before any JS; only the static/CSR host ever serves it as is),
	       (2) the app loader in app.ts (<img class="loader-logo"> in .global-app-loader: rendered into the SSR HTML and hidden by `fade-out` as soon as the session is initialised, which is immediate today; only the static loader above is really seen).
	     Their default files are byte-identical (assets/brand/waseet-mark.png == images/waseet-mark.png).
	     SSR (node server): the server fetched the public manifest and rendered the right src into the HTML itself (app loader); this script then does NOTHING (app-root carries ng-server-context),
	       so a stale browser cache can never swap in a different asset.
	     Static/CSR host: remembered manifest (localStorage, key = core/identity/site-identity.service.ts) -> swap at once. Nothing remembered (first visit / storage blocked / corrupt) -> the logo is held
	       invisible (never the wrong file) while ONE anonymous fetch of /api/public/site-identity runs (1.5 s limit), then it is shown with the right file (default on any failure/timeout);
	       the answer is handed to the app (window.__wsIdentityBoot, awaited by the app initializer) so the app loader uses the same file.
	     The same script also injects the remembered / fetched design-token CSS (<style id="ws-identity-tokens">, only when overrides exist). -->
	<script>
		(function () {
			try {
				if (document.querySelector('app-root[ng-server-context]')) return;
				var KEY = 'ws-site-identity-manifest-v1', API = '/api', ok = /^(https?:\/\/|\/(?!\/))/;
				var logo = function () { return document.querySelector('img.loader-logo'); };
				// design-token overrides: the remembered / just fetched CSS (same strict shape the app re-validates) goes into ONE <style id="ws-identity-tokens"> at the end of <head>, only when it exists
				var SEL = '(?::root|:root:not\\(\\.theme-light\\):not\\(\\.light-theme\\)|html\\.theme-light\\.theme-light,html\\.light-theme\\.light-theme,body\\.theme-light\\.theme-light,body\\.light-theme\\.light-theme,\\.theme-light\\.theme-light,\\.light-theme\\.light-theme)', DECL = '--[a-z0-9][a-z0-9-]{0,39}:[^;{}<>@\\\\/*]{1,220}';
				var TOK_RE = new RegExp('^(?:' + SEL + '\\{' + DECL + '(?:;' + DECL + ')*;?\\}\\s*){1,3}$');
				var tokens = function (css) {
					if (typeof css !== 'string' || !css || css.length > 20000 || /url\s*\(|expression|import|javascript:|<\/?style|\\/i.test(css) || !TOK_RE.test(css.trim())) return;
					var el = document.getElementById('ws-identity-tokens') || document.createElement('style');
					el.id = 'ws-identity-tokens'; el.textContent = css.trim(); document.head.appendChild(el);
				};
				var publish = function (urls) { window.__wsIdentityUrls = urls; var u = urls['logo.boot'], i = logo(); if (u && i) i.src = u; };
				var m = null;
				try { m = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { m = null; }
				var abs = m && m.abs && typeof m.abs === 'object' ? m.abs : null;
				if (abs) {
					var urls = {};
					for (var k in abs) { if (Object.prototype.hasOwnProperty.call(abs, k) && typeof abs[k] === 'string' && ok.test(abs[k])) urls[k] = abs[k]; }
					publish(urls);
					tokens(m.tokensCss);
					return;
				}
				var img = logo();
				if (!img || typeof fetch !== 'function') return;
				img.style.visibility = 'hidden';
				var done = false, finish = function () { if (done) return; done = true; img.style.visibility = ''; };
				var ctl = typeof AbortController === 'function' ? new AbortController() : null;
				var timer = setTimeout(function () { if (ctl) ctl.abort(); finish(); }, 1500);
				window.__wsIdentityBootPromise = fetch(API + '/public/site-identity', { headers: { Accept: 'application/json' }, cache: 'no-cache', credentials: 'omit', signal: ctl ? ctl.signal : undefined })
					.then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
					.then(function (j) {
						var b = j && j.data && j.items === undefined ? j.data : j;
						if (!b || typeof b.version !== 'number' || !b.items || typeof b.items !== 'object') throw new Error('shape');
						var urls = {};
						for (var k in b.items) {
							if (!Object.prototype.hasOwnProperty.call(b.items, k) || !b.items[k] || typeof b.items[k].url !== 'string') continue;
							var u = b.items[k].url;
							u = /^https?:\/\//i.test(u) ? u : (u.charAt(0) === '/' && u.charAt(1) !== '/') ? (u.indexOf(API + '/') === 0 ? u : API + u) : '';
							if (u && ok.test(u)) urls[k] = u;
						}
						window.__wsIdentityBoot = b;
						publish(urls);
						tokens(b.tokensCss);
					})
					.catch(function () { /* default stays */ })
					.then(function () { clearTimeout(timer); finish(); });
			} catch (e) { }
		})();
	</script>
</body>

</html>
