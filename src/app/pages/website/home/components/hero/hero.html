<section class="hero" aria-label="مقدمة الموقع">
  <div class="hero-glow" aria-hidden="true"></div>
  <div class="container">
    <h1>
      <span class="gradient">وسيط AI</span>
      <span class="hero-main-text">للخدمات الذكية</span>
    </h1>
    <p class="hero-desc">ربط طالبي الخدمة بمقدميها عبر عقود رقمية موثقة وضمانات مالية وذكاء اصطناعي يدعم كل خطوة مع بقاء القرار لك</p>
    <div class="hero-actions">
      @if (!authStore.isAuthenticated()) {
        <a routerLink="/auth/register" class="btn-primary">ابدأ مجانا الان</a>
      }
      <a href="/#how-it-works" class="btn-secondary" (click)="scrollToHowItWorks($event)">شاهد كيف يعمل</a>
    </div>
    <div class="hero-trust" role="list">
      <div class="trust-item" role="listitem"><span class="trust-icon"><svg class="icon icon-sm" aria-hidden="true"><use href="#ws-trust-free"></use></svg></span><span>بدون رسوم تسجيل</span></div>
      <div class="trust-item" role="listitem"><span class="trust-icon"><svg class="icon icon-sm" aria-hidden="true"><use href="#ws-trust-doc"></use></svg></span><span>عقود موثقة قانونيا</span></div>
      <div class="trust-item" role="listitem"><span class="trust-icon"><svg class="icon icon-sm" aria-hidden="true"><use href="#ws-trust-shield"></use></svg></span><span>مدفوعات بالضمان</span></div>
      <div class="trust-item" role="listitem"><span class="trust-icon"><svg class="icon icon-sm" aria-hidden="true"><use href="#ws-trust-ai"></use></svg></span><span>AI يقترح والانسان يقرر</span></div>
    </div>
  </div>
</section>
