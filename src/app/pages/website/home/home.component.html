<!-- COOKIE BANNER -->
@if (showCookieBanner) {
	<div class="cookie-bar visible" id="cookie-bar" role="region" aria-label="إشعار ملفات تعريف الارتباط">
		<div class="cookie-inner">
			<p class="cookie-txt">نستخدم ملفات تعريف الارتباط لتحسين تجربتك وفق <a routerLink="/privacy">سياسة الخصوصية</a></p>
			<div style="display:flex;gap:6px;flex-shrink:0">
				<button class="ck-accept" (click)="dismissCookie('accepted')">قبول</button>
				<button class="ck-decline" (click)="dismissCookie('declined')">رفض</button>
			</div>
		</div>
	</div>
}
