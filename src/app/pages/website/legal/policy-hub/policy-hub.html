<svg style="display:none" aria-hidden="true"><defs>
<symbol id="ws-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></symbol>
<symbol id="ws-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
<symbol id="ws-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></symbol>
<symbol id="ws-trust-ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><circle cx="4" cy="6" r="1.5"/><circle cx="20" cy="6" r="1.5"/><circle cx="4" cy="18" r="1.5"/><circle cx="20" cy="18" r="1.5"/><circle cx="12" cy="3" r="1.5"/><circle cx="12" cy="21" r="1.5"/><path d="M12 10V5M12 19v-5M10 12H5M19 12h-5M5.6 7.4l3.5 3.5M14.9 14.9l3.5 3.5M5.6 16.6l3.5-3.5M14.9 9.1l3.5-3.5"/></symbol>
</defs></svg>
<div class="page-wrap">
  <div class="policy-hero">
    <div class="container">
      <div class="policy-badge"><svg aria-hidden="true" style="width:10px;height:10px"><use href="#ws-file"></use></svg> وثائق قانونية</div>
      <h1 class="policy-h1">مركز السياسات</h1>
      <p class="policy-sub">جميع وثائق وسيط AI القانونية والتشغيلية في مكان واحد</p>
    </div>
  </div>

  <div class="container">
    <div class="policy-grid">
      @for (group of groups; track group.label) {
        <div class="policy-sec-label">{{ group.label }}</div>
        @for (item of group.items; track item.route) {
          <a [routerLink]="item.route" class="policy-card">
            <div class="policy-card-ico" [ngClass]="'t-' + item.tone"><svg aria-hidden="true"><use [attr.href]="'#ws-' + item.icon"></use></svg></div>
            <div class="policy-card-body">
              <h3>{{ item.title }}</h3>
              <p>{{ item.desc }}</p>
              <div class="policy-card-arr">اقرأ الوثيقة ←</div>
            </div>
          </a>
        }
      }
      <a routerLink="/" class="policy-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 5 12 12 19"/></svg>
        العودة للرئيسية
      </a>
    </div>
  </div>
</div>
