<app-sa-unavailable
  title="إدارة APIs + التكاملات"
  subtitle="نقاط API والتكاملات الخارجية"
  heading="إحصاءات الـ API والتكاملات غير متاحة بعد"
  reason="لا يوجد مصدر متصل يقيس عدد الطلبات أو زمن الاستجابة أو نسب الأخطاء أو حالة التكاملات الخارجية، لذلك لا تُعرض أي أرقام. المتاح فعليا هو فحص حياة الخادم أدناه وسجل الأحداث الأمنية."
  linkLabel="فتح الأمان وسجل الأحداث"
  linkTo="/supper-admin-overview/it/security"
>
  <div class="sa-apis-health" data-testid="api-health" role="status">
    @switch (health()) {
      @case ('checking') { <span>جارٍ فحص حياة الخادم…</span> }
      @case ('ok') { <span>فحص حياة الخادم (GET /api/health): يعمل</span> }
      @default { <span>فحص حياة الخادم (GET /api/health): تعذر الوصول إلى الخادم</span> }
    }
  </div>
</app-sa-unavailable>
