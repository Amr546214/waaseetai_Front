<div class="templates-wrap"><header class="panel-header"><h1>قوالب المكوّنات</h1><p class="sub">شكل الأزرار والبطاقات والحقول والجداول والقوائم من سجل المنصة. التعديل يغيّر الشكل، ولا يغيّر البيانات أو صلاحية الإجراءات.</p></header><nav class="category-tabs" aria-label="المكوّن">@for(group of groups;track group.id){<button type="button" class="cat-tab" [class.active]="selected()===group.id" (click)="selected.set(group.id)">{{group.label}}</button>}</nav><sc-token-editor [livePreview]="true" [keys]="['tokens.components']" [tokenPrefix]="'--comp-'+selected()+'-'" title="المكوّنات المنشورة" /></div>
