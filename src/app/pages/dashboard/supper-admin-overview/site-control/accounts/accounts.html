<div class="accounts-wrap"><header class="panel-header"><h1>هوية المستويات والشارات</h1><p class="sub">الأسماء والنسب والحدود تُقرأ من الخادم. هنا تتحكم في شكل الشارة لكل نوع حساب ومستوى، وليس في حساب العمولات أو أرصدة المستخدمين.</p></header><nav aria-label="نوع الحساب">@for(r of roles;track r.id){<button type="button" (click)="role.set(r.id);index.set(1)" [attr.aria-pressed]="role()===r.id">{{r.label}}</button>}</nav>
@if(busy()){<p role="status">جارٍ تحميل المستويات…</p>}@if(error()){<p role="alert">{{error()}}<button type="button" (click)="reload()">إعادة المحاولة</button></p>}
<div class="levels-grid">@for(row of rows();track row.level){<button type="button" (click)="index.set(row.level)" [attr.aria-pressed]="index()===row.level"><ws-level-badge [level]="display(row)" /> <span>المستوى {{row.level}}</span></button>}</div>
<sc-token-editor [keys]="['tokens.components']" [tokenPrefix]="prefix()" title="شكل شارة المستوى المنشور" /></div>
