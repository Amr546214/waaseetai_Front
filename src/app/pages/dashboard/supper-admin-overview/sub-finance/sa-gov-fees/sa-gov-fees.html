<section class="fgf-page" dir="rtl">
  <div class="fgf-hdr">
    <div>
      <h1 class="fgf-ttl">الرسوم الحكومية</h1>
      <p class="fgf-sub">لا توجد بيانات رسوم حكومية في المنصة</p>
    </div>
    <div class="fgf-actions">
      <button type="button" class="fgf-btn fgf-btn-ghost" disabled [attr.title]="emptyReason">تصدير الإقرار</button>
    </div>
  </div>

  <div class="ws-note ws-note--neutral" role="status" data-testid="sf-empty">
    <div class="ws-note-body">
      <div class="ws-note-lbl">{{ emptyTitle }}</div>
      <p class="ws-note-txt" data-testid="sf-empty-reason">{{ emptyReason }}</p>
    </div>
  </div>
</section>
