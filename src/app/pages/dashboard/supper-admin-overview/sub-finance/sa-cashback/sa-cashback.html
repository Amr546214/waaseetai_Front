<section class="fcb-page" dir="rtl">
  <div class="fcb-hdr">
    <div>
      <h1 class="fcb-ttl">إدارة الكاش باك</h1>
      <p class="fcb-sub">لا يوجد سجل توزيعات كاش باك</p>
    </div>
    <div class="fcb-actions">
      <button type="button" class="fcb-btn fcb-btn-ghost" disabled [attr.title]="emptyReason">تصدير</button>
      <button type="button" class="fcb-btn fcb-btn-ghost" disabled [attr.title]="emptyReason">توزيع دفعة</button>
    </div>
  </div>

  <div class="ws-note ws-note--neutral" role="status" data-testid="sf-empty">
    <div class="ws-note-body">
      <div class="ws-note-lbl">{{ emptyTitle }}</div>
      <p class="ws-note-txt" data-testid="sf-empty-reason">{{ emptyReason }}</p>
    </div>
  </div>
</section>
