<section class="ffb-page" dir="rtl">
  <div class="ffb-hdr">
    <div>
      <h1 class="ffb-ttl">الفوترة المستقبلية</h1>
      <p class="ffb-sub">لا توجد جدولة فوترة في المنصة</p>
    </div>
    <div class="ffb-actions">
      <button type="button" class="ffb-btn ffb-btn-ghost" disabled [attr.title]="emptyReason">حالة الاتصال</button>
      <button type="button" class="ffb-btn ffb-btn-ghost" disabled [attr.title]="emptyReason">مزامنة الآن</button>
    </div>
  </div>

  <div class="ws-note ws-note--neutral" role="status" data-testid="sf-empty">
    <div class="ws-note-body">
      <div class="ws-note-lbl">{{ emptyTitle }}</div>
      <p class="ws-note-txt" data-testid="sf-empty-reason">{{ emptyReason }}</p>
    </div>
  </div>
</section>
