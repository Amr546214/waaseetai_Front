	<!-- BG -->
	<div class="bg-grid" aria-hidden="true"></div>
	<div class="particles" id="particles-container" aria-hidden="true"></div>

	<!-- Sidebar overlay -->
	<div class="sb-ov" [class.show]="isSidebarOpen()" id="sb-ov" (click)="closeSidebar()"></div>

	<!-- TOPBAR -->
	<app-nav-dashboard (toggleSidebar)="toggleSidebar()"></app-nav-dashboard>

	<!-- SIDEBAR (wrapped without modifying internal sidebar code) -->
	<div class="sidebar-wrapper" [class.open]="isSidebarOpen()">
		<app-sidebar [isOpen]="isSidebarOpen()" (closeSidebar)="closeSidebar()"></app-sidebar>
	</div>

	<!-- MAIN CONTENT -->
	<main class="main">
		<div class="main-inner">
			<router-outlet></router-outlet>
		</div>

		<!-- FOOTER -->
		<div class="inner-foot">
			<span>&#169; {{ currentYear }} وسيط AI &middot; v{{ appVersion }}</span>
			<!-- <div class="inner-foot-links">
        <a routerLink="/privacy">PDPL</a>
        <a routerLink="/terms">الشروط</a>
        <span>SAMA</span>
        <span>ZATCA</span>
      </div> -->
		</div>
	</main>

	<!-- Real-Time Chat Message Toast Notification -->
	@if (chatToast().visible) {
	<div class="fixed bottom-6 left-6 z-[99999] w-[360px] max-w-[calc(100vw-2rem)] rounded-2xl bg-[#091230]/95 backdrop-blur-xl border border-[#2BD4C7]/40 shadow-[0_10px_35px_rgba(43,212,199,0.3)] p-4 text-white transition-all animate-in fade-in slide-in-from-bottom-5 duration-300"
		dir="rtl">
		<div class="flex items-start gap-3.5">
			<div
				class="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-br from-[#2BD4C7]/20 to-[#2B7FFF]/15 border border-[#2BD4C7]/40 flex items-center justify-center text-[#2BD4C7] shadow-[0_0_15px_rgba(43,212,199,0.25)]">
				<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
					<path stroke-linecap="round" stroke-linejoin="round"
						d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
				</svg>
			</div>
			<div class="flex-1 min-w-0">
				<div class="flex items-center justify-between mb-1">
					<span class="text-[11px] font-black text-[#2BD4C7] tracking-wider flex items-center gap-1.5">
						<span class="w-2 h-2 rounded-full bg-[#2BD4C7] animate-pulse"></span>
						رسالة جديدة
					</span>
					<button type="button" (click)="closeChatToast()"
						class="text-slate-400 hover:text-white transition-colors p-1" aria-label="إغلاق التنبيه">
						<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M6 18L18 6M6 6l12 12" />
						</svg>
					</button>
				</div>
				<h4 class="text-[13.5px] font-extrabold text-white mb-1 truncate">{{ chatToast().senderName }}</h4>
				<p class="text-[12px] text-slate-300 leading-relaxed mb-3 line-clamp-2">{{ chatToast().text }}</p>
				<button type="button" (click)="goToMessageFromToast()"
					class="inline-flex items-center justify-between w-full px-3.5 py-2 rounded-xl bg-gradient-to-r from-[#2BD4C7]/20 to-[#2B7FFF]/20 border border-[#2BD4C7]/40 text-[#2BD4C7] hover:text-white hover:bg-[#2BD4C7]/30 text-[12px] font-bold transition-all shadow-sm cursor-pointer border-none">
					<span>فتح المحادثة والرد</span>
					<svg class="w-4 h-4 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor"
						stroke-width="2">
						<path d="M15 19l-7-7 7-7" />
					</svg>
				</button>
			</div>
		</div>
	</div>
	}
