<!-- Full Screen Transparent Overlay -->
<!-- Canvas for Three.js rendering - Must be above other page content -->
<canvas #canvas class="fixed inset-0 z-[9999] pointer-events-none"></canvas>

<!-- Start Experience Overlay -->
@if (!hasStarted()) {
	<div class="fixed inset-0 z-[10000] backdrop-blur-md bg-black/60 flex items-center justify-center pointer-events-auto">
		<div class="text-center space-y-6 animate-fade-in">
			<div class="space-y-2">
				<h1 class="text-4xl font-bold text-white">مرحباً بك في وسيط AI</h1>
				<p class="text-lg text-cyan-200">مساعدك الذكي جاهز للخدمة</p>
			</div>

			<button
				(click)="startExperience()"
				class="group relative px-8 py-4 bg-gradient-to-r from-cyan-500 to-blue-500 text-white text-lg font-semibold rounded-full shadow-2xl hover:shadow-cyan-500/50 transition-all duration-300 hover:scale-105 active:scale-95 cursor-pointer"
			>
				<span class="flex items-center gap-3">
					<svg class="w-6 h-6 group-hover:animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
					</svg>
					ابدأ التجربة
				</span>
			</button>

			<p class="text-sm text-gray-300">انقر للسماح بتشغيل الصوت والرسوم المتحركة</p>
		</div>
	</div>
}

<!-- Loading State (Centered with pointer events) -->
@if (isLoading()) {
  <div class="loading-container">
    <div class="spinner"></div>
    <p class="loading-text">جاري تحميل المساعد الذكي...</p>
  </div>
}

<!-- Error State -->
@if (loadError()) {
  <div class="error-container">
    <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
      </path>
    </svg>
    <p class="error-text">{{ loadError() }}</p>
  </div>
}
